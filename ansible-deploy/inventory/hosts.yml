# Inventory удаленных серверов.
# Выбор сервера при запуске: -e target=<имя хоста из группы deploy_servers>
all:
  children:
    deploy_servers:
      hosts:
        prod1:
          ansible_host: server1.example.com
          ansible_user: deploy
          ansible_port: 22
          # ansible_ssh_private_key_file: /root/.ssh/id_ed25519
          base_domain: example.com          # общий домен: subdomain.base_domain
          nginx_conf_dir: /etc/nginx/conf.d # куда кладём конфиг реверс-прокси
        staging1:
          ansible_host: staging.example.com
          ansible_user: deploy
          base_domain: staging.example.com
          nginx_conf_dir: /etc/nginx/conf.d
