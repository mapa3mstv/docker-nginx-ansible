---
# Список текущих запущенных контейнеров и репозиториев, из которых они собраны.
# Запуск: ansible-playbook playbooks/containers.yml -e target=prod1
- name: List deployed containers on selected server
  hosts: "{{ target | default('localhost') }}"
  gather_facts: false
  vars:
    registry_file: /etc/ansible-deploy/registry.yml
    docker_bin: docker
  tasks:
    - name: Read registry
      ansible.builtin.slurp:
        src: "{{ registry_file }}"
      register: raw_registry
      failed_when: false

    - name: Parse registry
      ansible.builtin.set_fact:
        registry: >-
          {{ (raw_registry.content is defined)
             | ternary((raw_registry.content | b64decode | from_yaml), {}) }}

    - name: Query running containers state
      ansible.builtin.shell:
        cmd: >-
          {{ docker_bin }} ps -a --format
          '{{ '{{' }}.Names{{ '}}' }}|{{ '{{' }}.Status{{ '}}' }}|{{ '{{' }}.Image{{ '}}' }}'
      register: ps_out
      changed_when: false

    - name: Build container status map
      ansible.builtin.set_fact:
        ps_map: "{{ ps_map | combine({ item.split('|')[0]: item }) }}"
      vars:
        ps_map: {}
      loop: "{{ ps_out.stdout_lines }}"

    - name: Report repository -> container mapping
      ansible.builtin.debug:
        msg: >-
          repo={{ item.key }}
          container={{ item.value.container }}
          image={{ item.value.image }}
          url={{ item.value.repo_url }}
          ref={{ item.value.ref }}
          fqdn={{ item.value.fqdn }}
          state={{ (ps_map[item.value.container] | default(item.value.container ~ '|absent')).split('|')[1] | default('absent') }}
      loop: "{{ registry | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
